<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Salida de Vehículos</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #b21f1f;
            --success: #27ae60;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.4rem;
            margin: 0;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }

        .camera-card {
            border: 2px dashed #bbb;
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .camera-card:hover { border-color: var(--primary); }
        
        /* Contenedor de miniaturas */
        #galeria_preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .preview-img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .sig-container {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 8px;
            margin-top: 5px;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 150px;
            border-radius: 8px;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 5px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(26, 42, 108, 0.3);
        }

        .btn-submit:disabled { background: #bdc3c7; }

        #modalId {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 1000;
            width: 80%;
            max-width: 400px;
        }
        .overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div id="modalId">
    <h2 style="color: var(--success)">✅ ¡Salida Registrada!</h2>
    <p>Este es tu código de viaje para el regreso:</p>
    <h1 id="generatedID" style="background: #eee; padding: 10px; border-radius: 10px; color: var(--primary)">---</h1>
    <p style="font-size: 0.8rem; color: #666;">Sacale una captura o anotalo.</p>
    <button onclick="location.reload()" class="btn-submit">ENTENDIDO</button>
</div>

<div class="container">
    <div class="header">
        <h1>Permiso de Circulación</h1>
    </div>

    <form id="mainForm">
        <input type="hidden" name="accion" value="SALIDA">

        <div class="row">
            <div class="form-group">
                <label>FECHA</label>
                <input type="date" name="fecha" id="f_fecha" readonly>
            </div>
            <div class="form-group">
                <label>HORA SALIDA</label>
                <input type="time" name="hora" id="f_hora" readonly>
            </div>
        </div>

        <div class="form-group">
            <label>CONDUCTOR (Usuario)</label>
            <input type="text" name="usuario" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
            <label>ACOMPAÑANTES</label>
            <input type="text" name="acompanantes" placeholder="Nombres o 'Sin acompañantes'">
        </div>

        <div class="form-group">
            <label>VEHÍCULO</label>
            <select name="vehiculo" required>
                <option value="">Seleccionar unidad...</option>
                <option value="Camioneta 01 - Toyota">Camioneta 01 (Hilux)</option>
                <option value="Camioneta 02 - Ford">Camioneta 02 (Ranger)</option>
                <option value="Camioneta 03 - VW">Camioneta 03 (Amarok)</option>
            </select>
        </div>

        <div class="form-group">
            <label>DESTINO</label>
            <input type="text" name="destino" placeholder="Ej: Obra Norte / Cliente X" required>
        </div>

        <div class="form-group">
            <label>KM DE EGRESO</label>
            <input type="number" name="km_egreso" placeholder="Km actual del tablero" required>
        </div>

        <div class="form-group">
            <label>FOTOS DEL ESTADO (Máximo 5)</label>
            <div class="camera-card" onclick="document.getElementById('f_fotos').click();">
                <span id="txt_foto">📷 Tocar para sacar/elegir fotos</span>
                <input type="file" id="f_fotos" accept="image/*" capture="camera" multiple style="display:none">
            </div>
            <div id="galeria_preview"></div>
        </div>

        <div class="form-group">
            <label>FIRMA DIGITAL (Con el dedo)</label>
            <div class="sig-container">
                <canvas id="canvas_firma"></canvas>
            </div>
            <button type="button" class="btn-clear" id="btn_clear">Borrar y reintentar firma</button>
        </div>

        <button type="submit" class="btn-submit" id="btn_send">ENVIAR Y FIRMAR</button>
    </form>
</div>

<script>
    // 1. Configurar Fecha y Hora actuales
    const ahora = new Date();
    document.getElementById('f_fecha').value = ahora.toISOString().split('T')[0];
    document.getElementById('f_hora').value = ahora.getHours().toString().padStart(2, '0') + ':' + ahora.getMinutes().toString().padStart(2, '0');

    // 2. Configurar el panel de Firma
    const canvas = document.getElementById('canvas_firma');
    const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    document.getElementById('btn_clear').addEventListener('click', () => signaturePad.clear());

    // 3. Manejo de múltiples fotos y previsualización
    const inputFotos = document.getElementById('f_fotos');
    const galeria = document.getElementById('galeria_preview');
    let archivosBase64 = [];

    inputFotos.onchange = async function() {
        galeria.innerHTML = ""; // Limpiar vista previa anterior
        archivosBase64 = [];
        const files = Array.from(this.files).slice(0, 5); // Limitar a 5 fotos

        for (const file of files) {
            // Mostrar miniatura
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.className = 'preview-img';
            galeria.appendChild(img);

            // Convertir a Base64
            const base64 = await toBase64(file);
            archivosBase64.push(base64);
        }
        document.getElementById('txt_foto').innerText = archivosBase64.length + " fotos cargadas ✅";
    };

    // 4. Función para convertir archivo a Base64
    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // 5. Enviar datos a Google Apps Script
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxa5vN8mnjmOgHCkmXN9LHTr_sHeRiCEQZUW4yNDT51nj1M3Q5uXZYHVr3Dx37ML3wr/exec'; 
    const form = document.getElementById('mainForm');

    form.addEventListener('submit', async e => {
        e.preventDefault();
        
        if (signaturePad.isEmpty()) {
            alert("Por favor, firma el permiso antes de enviar.");
            return;
        }

        const btn = document.getElementById('btn_send');
        btn.disabled = true;
        btn.innerText = "Subiendo datos y " + archivosBase64.length + " fotos...";

        try {
            const formData = new URLSearchParams();
            
            formData.append('accion', 'SALIDA');
            formData.append('usuario', form.usuario.value);
            formData.append('acompanantes', form.acompanantes.value);
            formData.append('vehiculo', form.vehiculo.value);
            formData.append('destino', form.destino.value);
            formData.append('km_egreso', form.km_egreso.value);
            
            // Añadir cada foto con una clave única (foto_base64_1, foto_base64_2, etc.)
            archivosBase64.forEach((base64, index) => {
                formData.append('foto_base64_' + (index + 1), base64);
            });

            // Procesar Firma
            formData.append('firma_archivo', signaturePad.toDataURL());

            // Enviar vía POST
            await fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: formData
            });

            const idTemporal = "V-" + Date.now();
            document.getElementById('generatedID').innerText = idTemporal;
            document.getElementById('modalId').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';

        } catch (error) {
            console.error(error);
            alert("❌ Error al enviar. Verificá tu conexión.");
            btn.disabled = false;
            btn.innerText = "REINTENTAR ENVÍO";
        }
    });
</script>

</body>
</html>
