<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Regreso de Vehículos</title>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #b21f1f;
            --success: #27ae60;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--accent);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--accent);
            font-size: 1.4rem;
            margin: 0;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .camera-card {
            border: 2px dashed #bbb;
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        #galeria_preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 80px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .btn-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(178, 31, 31, 0.3);
        }

        .btn-submit:disabled { background: #bdc3c7; }

        /* Estilo para el ID de viaje (más grande) */
        .id-input {
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cierre de Viaje (Regreso)</h1>
    </div>

    <form id="regresoForm">
        <input type="hidden" name="accion" value="REGRESO">

        <div class="form-group">
            <label>CÓDIGO DE VIAJE (ID)</label>
            <input type="text" name="id_viaje" class="id-input" placeholder="Ej: V-171485..." required>
            <small style="color: #666">Ingresá el código que te dio el sistema al salir.</small>
        </div>

        <div class="form-group">
            <label>KM DE INGRESO (Llegada)</label>
            <input type="number" name="km_ingreso" placeholder="Km actual del tablero" required>
        </div>

        <div class="form-group">
            <label>FOTOS DEL ESTADO FINAL (Máximo 5)</label>
            <div class="camera-card" id="btn_camara">
                <span id="txt_foto">📷 Tocar para sacar foto de ingreso</span>
                <input type="file" id="f_fotos" accept="image/*" capture="camera" style="display:none">
            </div>
            <div id="galeria_preview"></div>
        </div>

        <button type="submit" class="btn-submit" id="btn_send">FINALIZAR VIAJE</button>
    </form>
</div>

<script>
    // --- LÓGICA DE FOTOS ACUMULADAS ---
    const inputFotos = document.getElementById('f_fotos');
    const galeria = document.getElementById('galeria_preview');
    const btnCamara = document.getElementById('btn_camara');
    let archivosBase64 = []; 

    btnCamara.onclick = () => {
        if (archivosBase64.length >= 5) {
            alert("Máximo de 5 fotos alcanzado.");
            return;
        }
        inputFotos.click();
    };

    inputFotos.onchange = async function() {
        const file = this.files[0];
        if (!file) return;

        const base64 = await toBase64(file);
        archivosBase64.push(base64);
        
        actualizarGaleria();
        this.value = ""; 
    };

    function actualizarGaleria() {
        galeria.innerHTML = "";
        archivosBase64.forEach((base64, index) => {
            const container = document.createElement('div');
            container.className = 'preview-container';
            const img = document.createElement('img');
            img.src = base64;
            img.className = 'preview-img';
            const btnDel = document.createElement('button');
            btnDel.innerText = "X";
            btnDel.className = 'btn-remove';
            btnDel.onclick = (e) => {
                e.stopPropagation();
                archivosBase64.splice(index, 1);
                actualizarGaleria();
            };
            container.appendChild(img);
            container.appendChild(btnDel);
            galeria.appendChild(container);
        });
        document.getElementById('txt_foto').innerText = archivosBase64.length + " fotos de regreso";
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // --- ENVÍO DE DATOS AL SCRIPT ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxa5vN8mnjmOgHCkmXN9LHTr_sHeRiCEQZUW4yNDT51nj1M3Q5uXZYHVr3Dx37ML3wr/exec'; 
    const form = document.getElementById('regresoForm');

    form.addEventListener('submit', async e => {
        e.preventDefault();
        
        const btn = document.getElementById('btn_send');
        btn.disabled = true;
        btn.innerText = "Finalizando viaje...";

        try {
            const formData = new URLSearchParams();
            formData.append('accion', 'REGRESO');
            formData.append('id_viaje', form.id_viaje.value);
            formData.append('km_ingreso', form.km_ingreso.value);
            
            // Enviamos las fotos con el nombre que espera el script (foto_regreso_base64_X)
            archivosBase64.forEach((base64, index) => {
                formData.append('foto_regreso_base64_' + (index + 1), base64);
            });

            await fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: formData
            });

            alert("✅ VIAJE FINALIZADO CORRECTAMENTE.\nEl registro se ha actualizado en la planilla.");
            location.reload();

        } catch (error) {
            alert("❌ Error al conectar con el servidor.");
            btn.disabled = false;
            btn.innerText = "REINTENTAR FINALIZAR";
        }
    });
</script>

</body>
</html>
